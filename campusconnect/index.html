
<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CampusConnect 🎓</h1>
        <p>Discover what's happening around your campus!</p>
    </header>

    <main>
        <h2>Upcoming Events</h2>

        <div class="events">
            <div class="event">
                <h3>Tech Fest 2026</h3>
                <p>A day filled with coding and technology events.</p>
                <button onclick="showInterest(this)">I'm Interested</button>
            </div>

            <div class="event">
                <h3>Photography Contest</h3>
                <p>Showcase your photography skills.</p>
                <button onclick="showInterest(this)">I'm Interested</button>
            </div>

            <div class="event">
                <h3>College Cultural Day</h3>
                <p>Enjoy music, dance and performances.</p>
                <button onclick="showInterest(this)">I'm Interested</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
